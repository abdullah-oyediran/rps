<html>
    <head>
        <title>Sign up form</title>
        <link rel="stylesheet" href="css/styles.css">
        <meta charset="utf-8">
    </head>
    <body>
        <div id="app">
            <div class="section">
                <div id="logo-banner">
                    <img id="odin-logo" alt="Odin logo" src="images/odin-logo.png">
                    <h2 id="logo">ODIN</h2>
                </div>
            </div>
            <div class="section">
                <div id="header">
                    <p>
                        This is definitely a real online service!
                        You know you need something like this in
                        your life to help you realize your
                        deepest dreams.
                    </p>
                    <p>
                        Sign up now to get started.
                        <br>
                        <br>
                        You know you want it!
                    </p>
                </div>
                <form>
                    <p>* represents required information</p>
                    <div>
                        <label for="f-name">FIRST NAME *</label>
                        <input required type="text" id="f-name">
                    </div>

                    <div>
                        <label for="l-name">LAST NAME</label>
                        <input type="text" id="l-name">
                    </div>

                    <div>
                        <label for="email">EMAIL *</label>
                        <input type="email" required id="email">
                    </div>

                    <div>
                        <label for="p-no">PHONE NUMBER *</label>
                        <input type="text" required id="p-no">
                    </div>

                    <div>
                        <label for="p-word">PASSWORD *</label>
                        <input type="password" required id="p-word">
                    </div>

                    <div>
                        <label for="c-p-word">CONFIRM PASSWORD *</label>
                        <input id="c-p-word" type="password" required>
                    </div>
                </form>
                <div id="footer">
                    <button>Create Account</button>
                    <p>Already have an account? <a href="#">Login</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
